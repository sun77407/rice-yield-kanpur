[project]
name = "rice-yield-kanpur"
version = "0.1.0"
description = "Offline-first rice yield prediction and RAG advisory system for Kanpur, Uttar Pradesh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Tejas Singh Chandel" }]
# Ranges here; exact versions are pinned in uv.lock (committed) by `uv lock`.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=3.6",
    "shap>=0.46",
    "statsmodels>=0.14",
    "pymc>=5.16",
    "arviz>=0.19",
    "onnx>=1.16",
    "onnxmltools>=1.12",
    "onnxruntime>=1.18",
    "earthengine-api>=1.0",
    "geemap>=0.34",
    "rasterio>=1.4",
    "xarray>=2024.6",
    "netcdf4>=1.7",
    "cdsapi>=0.7",
    "requests>=2.32",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "ollama>=0.3",
    "pypdf>=4.3",
    "streamlit>=1.38",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "dvc>=3.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
